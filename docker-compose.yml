
services:
  php:
    build: .
    ports:
      - "8888:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=512M
      - MYSQL_HOST=mysql # Nome do serviço MySQL
      - MYSQL_DATABASE=vivazen_db
      - MYSQL_USER=vivazen
      - MYSQL_PASSWORD=password
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=vivazen_db
      - MYSQL_USER=vivazen
      - MYSQL_PASSWORD=password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: